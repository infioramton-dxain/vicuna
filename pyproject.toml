[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macmini"
version = "0.1.0"
description = "Long-only swing-trading system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "pyarrow>=15",
    "vectorbt>=0.26,<0.27",
    "plotly>=5,<6",              # vectorbt 0.26 references plotly's heatmapgl trace, removed in plotly 6
    "ta>=0.11",                  # spec called for pandas-ta but its 0.3.x line was unpublished from PyPI; ta covers the same indicators
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "alpaca-py>=0.30",
    "finnhub-python>=2.4",
    "requests>=2.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "feedparser>=6",
    "sqlalchemy>=2",
    "click>=8.1",
    "python-dotenv>=1",
    "pyyaml>=6",
    "google-generativeai>=0.7",
    "openai>=1.40",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
